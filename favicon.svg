<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="50%"  stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield body -->
  <path d="M50 4 L90 20 L90 56 C90 77 72 93 50 98 C28 93 10 77 10 56 L10 20 Z"
        fill="url(#shield-grad)"/>

  <!-- Shine overlay (top-left) -->
  <path d="M50 8 L86 23 L86 52 C86 72 69 87 50 93"
        fill="none" stroke="url(#shine)" stroke-width="18" stroke-linecap="round" opacity="0.5"/>

  <!-- Inner edge highlight -->
  <path d="M50 10 L84 25 L84 54 C84 74 68 89 50 94 C32 89 16 74 16 54 L16 25 Z"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Lock body -->
  <rect x="33" y="55" width="34" height="26" rx="5.5" fill="white" opacity="0.96" filter="url(#glow)"/>

  <!-- Lock shackle -->
  <path d="M40 55 L40 44 Q40 31 50 31 Q60 31 60 44 L60 55"
        stroke="white" stroke-width="7" fill="none"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.96"/>

  <!-- Shackle dark outline for depth -->
  <path d="M40 55 L40 44 Q40 31 50 31 Q60 31 60 44 L60 55"
        stroke="rgba(99,102,241,0.4)" stroke-width="4.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Keyhole circle -->
  <circle cx="50" cy="65.5" r="5.5" fill="#4338ca"/>
  <!-- Keyhole stem -->
  <rect x="47.2" y="66" width="5.6" height="8.5" rx="2.2" fill="#4338ca"/>
</svg>
